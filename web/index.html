<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071018" />
    <meta name="author" content="Wisdom Akpabio" />
    <title>Where the centre holds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="./src/style.css?v=2" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-text">
        <p class="topbar-kicker">
          <a
            class="gh-link"
            href="https://github.com/whizialfa/nigeria-urban-spread"
            target="_blank"
            rel="noopener"
            >github.com/whizialfa</a
          >
          · Wisdom Akpabio · 1990–2020
        </p>
        <h1>
          <span class="title-full">Where the centre holds</span>
          <span class="title-short">Centre holds</span>
        </h1>
      </div>
      <div class="header-tools" id="header-tools">
        <label class="basemap-wrap" title="Basemap">
          <span class="sr-only">Basemap</span>
          <select id="basemap-select" aria-label="Basemap">
            <option value="gray" selected>Gray</option>
            <option value="streets">Streets</option>
            <option value="imagery">Imagery</option>
          </select>
        </label>
        <button type="button" id="tour-btn" title="How to read this map">?</button>
        <button type="button" id="share-btn" title="Copy link to this chapter">Link</button>
        <a
          class="paper-link"
          href="./paper/where_the_centre_holds.pdf"
          target="_blank"
          rel="noopener"
          title="Download the paper PDF"
          >PDF</a
        >
      </div>
    </header>

    <div class="scrolly">
      <div class="map-sticky" aria-hidden="true">
        <div id="map"></div>
        <div class="map-caption" id="map-caption"></div>
      </div>
      <article class="chapters" id="chapters"></article>
    </div>

    <div class="tour" id="tour" hidden>
      <div class="tour-scrim" id="tour-scrim"></div>
      <div class="tour-card" role="dialog" aria-labelledby="tour-title">
        <p class="tour-kicker" id="tour-kicker">Tour</p>
        <h2 id="tour-title"></h2>
        <p id="tour-body"></p>
        <div class="tour-actions">
          <button type="button" class="tour-ghost" id="tour-skip">Skip</button>
          <button type="button" class="tour-next" id="tour-next">Next</button>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <script type="module" src="./src/main.js?v=2"></script>
  </body>
</html>
